name: Create New Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version/tag (for example: v1.3.0)"
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        description: "Token with permission to push commits and tags"
        required: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Manifest & Create Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_TAG"
            echo "Expected a semantic version such as v1.3.0 or 1.3.0"
            exit 1
          fi

      - name: Bump manifest version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          node - <<'JS'
          const fs = require('fs');

          const releaseTag = process.env.TARGET_VERSION;
          const version = releaseTag.replace(/^v/, '');
          const versionLine = `version '${version}'`;
          const manifestPath = 'fxmanifest.lua';

          if (!fs.existsSync(manifestPath)) {
            console.error('fxmanifest.lua was not found in the repository root.');
            process.exit(1);
          }

          const manifest = fs.readFileSync(manifestPath, 'utf8');
          let updated = manifest.replace(/^version\s+['"].*['"]\s*$/m, versionLine);

          if (!updated.includes(versionLine)) {
            if (/^url\s+['"].*['"]\s*$/m.test(manifest)) {
              updated = manifest.replace(/^(url\s+['"].*['"]\s*)$/m, `$1\n${versionLine}`);
            } else {
              console.error("No 'version' or 'url' line found in fxmanifest.lua - can't bump version.");
              process.exit(1);
            }
          }

          fs.writeFileSync(manifestPath, updated);
          console.log(`Manifest version set to ${version} (release tag: ${releaseTag})`);
          JS

      - name: Commit manifest and create tag
        uses: EndBug/add-and-commit@v9
        with:
          add: fxmanifest.lua
          push: true
          message: "chore(release): ${{ inputs.version }}"
          tag: ${{ inputs.version }}
          default_author: github_actions
