name: ASTRA Commit Notifications

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  notify:
    name: Notify ASTRA Discord
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        uses: Qbox-project/pipeline-pling@v1
        with:
          webhook-url: ${{ secrets.DISCORD_COMMIT_WEBHOOK }}
          accent-color: "#7c3aed"
          branch-allowlist: "main"
          use-sender-avatar: "false"
          use-repo-username: "false"
