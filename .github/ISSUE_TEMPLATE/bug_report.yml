name: Bug report
description: Something in an ASTRA resource is broken or behaving incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first — a lot of reports turn out to be duplicates or already fixed on `main`. Make sure you're on the latest tagged release before reporting.
  - type: dropdown
    id: component
    attributes:
      label: Affected Resource
      description: Which resource is this bug in? Pick "Other / not sure" if it spans more than one.
      options:
        - astra_core
        - astra_inventory
        - astra_characters
        - astra_ped
        - astra_doors
        - astra_jobs
        - astra_labor
        - astra_finance
        - astra_admin
        - astra_phone
        - astra_hud
        - astra_chat
        - astra_menu
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What's broken
      description: Short, concrete description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Do ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. actual
      description: What should have happened, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste relevant F8 client console and/or server console errors. Leave blank if there was none.
      render: shell
  - type: input
    id: version
    attributes:
      label: Resource version
      description: Tag or `version` line from the resource's fxmanifest.lua.
      placeholder: e.g. v1.3.0
    validations:
      required: true
  - type: input
    id: astra_core_version
    attributes:
      label: astra_core version
      placeholder: e.g. v1.0.0
  - type: input
    id: third_party
    attributes:
      label: Third-party dependencies in play
      description: Anything outside ASTRA that could be interacting with this (ox_target, custom scripts, etc).
      placeholder: None
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Screenshots, clips, logs — whatever helps.
